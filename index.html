<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Workout Tracker</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0F1115" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Workout Tracker" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0F1115;
    --bg2: #14161C;
    --card-bg: #171A21;
    --border: #1E2129;
    --border2: #262A33;
    --text: #EDEDF0;
    --muted: #8A8E99;
    --muted2: #6B6F7A;
    --muted3: #4A4E58;
    --input-bg: #0F1115;
    --overlay: rgba(0,0,0,0.6);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #F4F5F7;
    --bg2: #FFFFFF;
    --card-bg: #FFFFFF;
    --border: #E4E6EB;
    --border2: #D8DBE0;
    --text: #14161C;
    --muted: #6B6F7A;
    --muted2: #8A8E99;
    --muted3: #A8ADB8;
    --input-bg: #F0F1F4;
    --overlay: rgba(20,22,28,0.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior-y: none;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  header.topbar {
    padding: max(20px, env(safe-area-inset-top)) 20px 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header.topbar .title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  header.topbar .title-group { display: flex; align-items: center; gap: 10px; min-width: 0; }
  header.topbar .app-header-icon { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: block; }
  header.topbar button.icon-btn {
    background: none; border: none; color: var(--muted); cursor: pointer; padding: 6px; display: flex;
  }
  header.topbar button.icon-btn svg { width: 22px; height: 22px; }
  .modal-overlay {
    position: fixed; inset: 0; background: var(--overlay); z-index: 50;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal-overlay-top { align-items: flex-start; }
  .modal-sheet {
    background: var(--card-bg); border: 1px solid var(--border2); border-radius: 20px 20px 0 0;
    width: 100%; max-width: 480px; padding: 20px; padding-bottom: calc(24px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 14px;
    max-height: 85vh; max-height: 85dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .modal-sheet-top {
    border-radius: 0 0 20px 20px;
    padding-top: calc(20px + env(safe-area-inset-top));
    padding-bottom: 24px;
  }
  .modal-sheet h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .modal-sheet p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .modal-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px; border-radius: 10px; border: none; font-size: 12.5px; font-weight: 600;
    cursor: pointer; font-family: inherit; width: 100%;
  }
  .modal-btn svg { width: 15px; height: 15px; }
  .modal-btn.primary { background: var(--accent, #2DD4BF); color: #0F1115; }
  .modal-btn.secondary { background: var(--border); color: var(--text); border: 1px solid var(--border2); }
  .modal-close { text-align: center; color: var(--muted2); font-size: 13px; padding: 8px; cursor: pointer; }
  .status-msg { font-size: 13px; text-align: center; padding: 6px; border-radius: 8px; }
  .status-msg.ok { background: rgba(76,175,125,0.15); color: #4CAF7D; }
  .status-msg.err { background: rgba(232,131,74,0.15); color: #E8834A; }
  .backup-banner {
    background: rgba(45,212,191,0.1); border-bottom: 1px solid rgba(45,212,191,0.25);
    padding: 12px 20px; display: none; flex-direction: column; gap: 8px;
  }
  .backup-banner p { margin: 0; font-size: 13px; color: #1F8A78; line-height: 1.4; }
  [data-theme="dark"] .backup-banner p, :root:not([data-theme]) .backup-banner p { color: #C9F7F0; }
  .backup-banner-actions { display: flex; gap: 8px; }
  .backup-banner-actions button {
    flex: 1; padding: 8px; border-radius: 8px; border: none; font-size: 12.5px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .backup-banner-actions .now-btn { background: #2DD4BF; color: #0F1115; }
  .backup-banner-actions .later-btn { background: transparent; color: var(--muted); border: 1px solid var(--border2); }
  main#content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: none; -ms-overflow-style: none; }
  main#content::-webkit-scrollbar { display: none; width: 0; height: 0; }
  nav.tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg2); border-top: 1px solid var(--border);
    display: flex; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabbar button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 0; background: none; border: none; color: var(--muted2); cursor: pointer; font-family: inherit;
  }
  nav.tabbar svg { width: 22px; height: 22px; }
  nav.tabbar.icon-size-large svg { width: 34px; height: 34px; }
  nav.tabbar.icon-size-tiny svg { width: 16px; height: 16px; }
  nav.tabbar span { font-size: 11px; font-weight: 500; }
  nav.tabbar button.active span { font-weight: 700; }

  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
  .card-label { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .row { display: flex; gap: 10px; min-width: 0; }
  input[type="date"], input[type="number"], input[type="text"] {
    flex: 1; width: 100%; min-width: 0; background: var(--input-bg); border: 1px solid var(--border2); border-radius: 10px;
    padding: 10px 12px; color: var(--text); font-size: 14px; outline: none; font-family: inherit;
  }
  .btn-primary {
    background: #2DD4BF; border: none; border-radius: 10px; width: 44px; flex-shrink: 0;
    color: #0F1115; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .chip {
    padding: 8px 14px; border-radius: 20px; border: 1.5px solid var(--border2); background: transparent;
    color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .health-divider { border-top: 1px solid var(--border2); margin: 4px 0 14px; position: relative; }
  .list-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--border);
  }
  .list-row:last-child { border-bottom: none; }
  .workout-item { padding: 10px 4px; border-bottom: 1px solid var(--border); }
  .workout-item:last-child { border-bottom: none; }
  .workout-note { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 6px; padding-left: 18px; line-height: 1.4; }
  .delete-btn { background: none; border: none; color: var(--text); opacity: 0.85; cursor: pointer; padding: 4px; flex-shrink: 0; display: flex; align-items: center; }
  .delete-btn svg { width: 18px; height: 18px; }
  .btn-primary svg { width: 18px; height: 18px; }
  .empty { color: var(--muted2); font-size: 13px; padding: 8px 0; text-align: center; }
  .stat-row { display: flex; gap: 10px; }
  .stat-card { flex: 1; text-align: center; padding: 14px; }
  .stat-card .title { font-size: 11px; color: var(--muted2); margin-bottom: 6px; }
  .stat-card .count { font-size: 22px; font-weight: 700; }
  .stat-card .unit { font-size: 10px; color: var(--muted2); margin-bottom: 6px; }
  .stat-card .minutes { font-size: 12px; color: var(--muted); }
  .legend { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
  .bar-row { margin-bottom: 10px; }
  .bar-row-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .bar-track { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; }
  .gender-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .gender-btn { flex: 1; padding: 8px 0; border-radius: 20px; border: 1.5px solid var(--border2); background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .field { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .field-label { font-size: 11px; color: var(--muted2); margin-bottom: 4px; }
  .settings-indent { padding-left: 14px; margin-left: 2px; }
  .settings-indent > .toggle-row > span:first-child::before,
  .settings-indent > .field-label::before { content: "•"; color: var(--muted2); margin-right: 6px; }
  .activity-btn {
    display: flex; flex-direction: column; align-items: flex-start; text-align: left;
    padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--border2); background: transparent;
    cursor: pointer; width: 100%; font-family: inherit; margin-bottom: 6px;
  }
  .activity-btn .lbl { font-size: 13px; font-weight: 600; color: var(--text); }
  .activity-btn .desc { font-size: 11px; color: var(--muted2); }
  .goal-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
  .goal-label { font-size: 13px; color: var(--muted); }
  .goal-value { font-size: 15px; font-weight: 700; }
  .disclaimer { font-size: 11px; color: var(--muted3); text-align: center; padding: 0 8px; }
  .weight-hero { display: flex; align-items: center; justify-content: space-between; }
  .weight-hero .value { font-size: 32px; font-weight: 700; }
  .weight-hero .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .diff { display: flex; align-items: center; gap: 4px; font-size: 14px; }
  .history-scroll { max-height: 280px; overflow-y: auto; }
  .chart-wrap { position: relative; height: 200px; width: 100%; }
  .streak-badge { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #E8834A; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .toggle-switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; inset: 0; background: var(--border2); border-radius: 999px; cursor: pointer; transition: background .15s;
  }
  .toggle-slider::before {
    content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s;
  }
  .toggle-switch input:checked + .toggle-slider { background: var(--accent, #2DD4BF); }
  .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }
  .theme-row { display: flex; gap: 8px; }
  .theme-btn { flex: 1; padding: 8px 0; border-radius: 10px; border: 1.5px solid var(--border2); background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-select {
    background: var(--input-bg); border: 1px solid var(--border2); border-radius: 10px; color: var(--text);
    font-size: 13px; padding: 8px 10px; font-family: inherit;
  }
  .compare-col { flex: 1; text-align: center; }
  .compare-col .label { font-size: 11px; color: var(--muted2); margin-bottom: 4px; }
  .compare-col .val { font-size: 18px; font-weight: 700; }
  .compare-delta { font-size: 12px; margin-top: 2px; }
  .icon-20 svg { width: 20px; height: 20px; display: block; }
  .icon-14 svg { width: 14px; height: 14px; display: block; }
  /* Ram/glow: roterande regnbågssken, upplåst på level 75 (högsta tiern). */
  @keyframes avatarFrameSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .avatar-frame-rainbow {
    position: relative; overflow: hidden; border-radius: 50%; clip-path: circle(50%);
    background: conic-gradient(from 0deg, #FF3DB0, #FFD24C, #34D97B, #2DE0FF, #9B6BFF, #FF3DB0);
    box-shadow: 0 0 10px rgba(255,255,255,0.35);
  }
  .avatar-frame-rainbow::before {
    content: ""; position: absolute; inset: -30%;
    background: conic-gradient(from 0deg, #FF3DB0, #FFD24C, #34D97B, #2DE0FF, #9B6BFF, #FF3DB0);
    animation: avatarFrameSpin 3s linear infinite;
  }
  .avatar-frame-rainbow > img, .avatar-frame-rainbow > div { position: relative; z-index: 1; }
  /* Ram/glow: roterande "komet" - en ensam gnistrande svans som jagar runt
     ringen. Färgen kommer via CSS-variabler (--comet-c/--comet-c-soft/
     --comet-glow) satta inline per val, så samma klass funkar för alla
     komet-färger. */
  @keyframes avatarFrameSpinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
  @keyframes avatarFramePulse {
    0%, 100% { box-shadow: 0 0 4px 1px var(--pulse-c, rgba(226,75,74,0.5)); filter: drop-shadow(0 0 2px var(--pulse-c, rgba(226,75,74,0.5))); }
    50% { box-shadow: 0 0 14px 4px var(--pulse-c, rgba(226,75,74,0.5)); filter: drop-shadow(0 0 8px var(--pulse-c, rgba(226,75,74,0.5))); }
  }
  /* box-shadow klipps bort av en ancestor/egen clip-path (så som oktagon-
     formen på badgen), så den åttkantiga varianten animerar filter:drop-shadow
     istället - det respekterar clip-path och syns därför runt kanten. */
  @keyframes avatarFramePulseOctagon {
    0%, 100% { filter: drop-shadow(0 0 5px var(--pulse-c, rgba(226,75,74,0.8))) drop-shadow(0 0 2px var(--pulse-c, rgba(226,75,74,0.8))); }
    50% { filter: drop-shadow(0 0 20px var(--pulse-c, rgba(226,75,74,0.95))) drop-shadow(0 0 9px var(--pulse-c, rgba(226,75,74,0.95))); }
  }
  @keyframes avatarFrameFrostShimmer {
    0%, 100% { box-shadow: 0 0 4px rgba(200,240,255,0.3); }
    50% { box-shadow: 0 0 10px rgba(200,240,255,0.7); }
  }
  .avatar-frame-comet {
    position: relative; overflow: hidden; border-radius: 50%; clip-path: circle(50%);
    box-shadow: 0 0 6px var(--comet-glow, rgba(255,210,76,0.35));
  }
  .avatar-frame-comet::before {
    content: ""; position: absolute; inset: -30%;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 265deg,
      var(--comet-c-soft, rgba(255,210,76,0.15)) 300deg,
      var(--comet-c, rgba(255,210,76,0.9)) 335deg,
      #FFFFFF 353deg,
      transparent 360deg);
    animation: avatarFrameSpin 2.2s linear infinite;
  }
  .avatar-frame-comet > img, .avatar-frame-comet > div { position: relative; z-index: 1; }
  /* Ram/glow: dubbelkomet - två svansar som jagar varandra åt varsitt håll. */
  .avatar-frame-dualcomet {
    position: relative; overflow: hidden; border-radius: 50%; clip-path: circle(50%);
    box-shadow: 0 0 6px var(--comet-glow, rgba(255,77,77,0.35));
  }
  .avatar-frame-dualcomet::before {
    content: ""; position: absolute; inset: -30%;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 250deg,
      var(--comet-c2, rgba(255,77,77,0.5)) 285deg,
      var(--comet-c, rgba(255,77,77,0.9)) 325deg,
      #FFFFFF 345deg,
      transparent 360deg);
    animation: avatarFrameSpin 2s linear infinite;
  }
  .avatar-frame-dualcomet::after {
    content: ""; position: absolute; inset: -30%;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 15deg,
      #FFFFFF 15deg,
      var(--comet-c, rgba(255,77,77,0.9)) 35deg,
      var(--comet-c2, rgba(255,77,77,0.5)) 75deg,
      transparent 125deg,
      transparent 360deg);
    animation: avatarFrameSpinRev 2s linear infinite;
    mix-blend-mode: screen;
  }
  .avatar-frame-dualcomet > img, .avatar-frame-dualcomet > div { position: relative; z-index: 1; }
  /* Ram/glow: dubbelkomet i RGB - samma spegelvända möt-teknik som ovan, men
     färgen cyklar genom regnbågen via en animerad hue-rotation istället för
     en fast färg, med samma långa svans som övriga komet-ramar. */
  .avatar-frame-dualcomet-rainbow {
    position: relative; overflow: hidden; border-radius: 50%; clip-path: circle(50%);
  }
  .avatar-frame-dualcomet-rainbow::before {
    content: ""; position: absolute; inset: -30%;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 250deg,
      rgba(255,77,77,0.5) 285deg,
      rgba(255,77,77,0.9) 325deg,
      #FFFFFF 345deg,
      transparent 360deg);
    animation: avatarFrameSpin 2s linear infinite, avatarFrameHueCycle 3s linear infinite;
  }
  .avatar-frame-dualcomet-rainbow::after {
    content: ""; position: absolute; inset: -30%;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 15deg,
      #FFFFFF 15deg,
      rgba(255,77,77,0.9) 35deg,
      rgba(255,77,77,0.5) 75deg,
      transparent 125deg,
      transparent 360deg);
    animation: avatarFrameSpinRev 2s linear infinite, avatarFrameHueCycle 3s linear infinite;
    mix-blend-mode: screen;
  }
  .avatar-frame-dualcomet-rainbow > img, .avatar-frame-dualcomet-rainbow > div { position: relative; z-index: 1; }
  /* Ram/glow: eld - två lager orange/röda bågar i olika hastighet ovanpå
     varandra ger en flimrande låga-känsla. */
  .avatar-frame-fire {
    position: relative; overflow: hidden; border-radius: 50%; clip-path: circle(50%);
    box-shadow: 0 0 8px rgba(226,75,74,0.4);
  }
  .avatar-frame-fire::before {
    content: ""; position: absolute; inset: -30%;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 250deg,
      rgba(239,159,39,0.5) 285deg,
      rgba(226,75,74,0.9) 325deg,
      #FFFFFF 345deg,
      transparent 360deg);
    animation: avatarFrameSpin 2s linear infinite;
  }
  .avatar-frame-fire::after {
    content: ""; position: absolute; inset: -30%;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 15deg,
      #FFFFFF 15deg,
      rgba(226,75,74,0.9) 35deg,
      rgba(239,159,39,0.5) 75deg,
      transparent 125deg,
      transparent 360deg);
    animation: avatarFrameSpinRev 2s linear infinite;
    mix-blend-mode: screen;
  }
  .avatar-frame-fire > img, .avatar-frame-fire > div { position: relative; z-index: 1; }
  /* Ram/glow: frost - samma tvålagers-teknik som eld-ringen (två motroterande
     bågar i olika hastighet), fast i isblå/vita toner plus ett mjukt
     pulserande sken för en glittrig känsla. */
  .avatar-frame-frost {
    position: relative; overflow: hidden; border-radius: 50%; clip-path: circle(50%);
    animation: avatarFrameFrostShimmer 1.8s ease-in-out infinite;
  }
  .avatar-frame-frost::before {
    content: ""; position: absolute; inset: -30%;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 250deg,
      rgba(200,240,255,0.5) 285deg,
      rgba(45,224,255,0.9) 325deg,
      #FFFFFF 345deg,
      transparent 360deg);
    animation: avatarFrameSpin 2.8s linear infinite;
  }
  .avatar-frame-frost::after {
    content: ""; position: absolute; inset: -30%;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 15deg,
      #FFFFFF 15deg,
      rgba(45,224,255,0.9) 35deg,
      rgba(200,240,255,0.5) 75deg,
      transparent 125deg,
      transparent 360deg);
    animation: avatarFrameSpinRev 2.8s linear infinite;
    mix-blend-mode: screen;
  }
  .avatar-frame-frost > img, .avatar-frame-frost > div { position: relative; z-index: 1; }
  /* Ram/glow: pulserande - ingen rotation, bara ett sken som andas i takt. */
  .avatar-frame-pulse {
    position: relative;
    animation: avatarFramePulse 1.1s ease-in-out infinite;
  }
  /* Åttkantig variant: klipper hela ramen (inkl. de roterande sken-lagren)
     till bälte-badgens egen oktagonform istället för en cirkel, så skenet
     följer kanten på själva konstverket. Formen är uppmätt från badge-PNG:erna. */
  .frame-shape-octagon {
    clip-path: polygon(47% 0%, 53% 0%, 92% 25%, 92% 75%, 53% 100%, 47% 100%, 8% 75%, 8% 25%);
  }
  .avatar-frame-pulse.frame-shape-octagon {
    animation: avatarFramePulseOctagon 1.1s ease-in-out infinite;
  }
  /* Jakt/eldfrost/fullshift/cycleall-klasserna har en egen cirkel-clip-path
     (för att garantera cirkelform t.ex. i flikarna), vilket annars vinner
     över oktagon-formen ovan pga lika specificitet + senare i filen. Denna
     kombinerade selektor väger tyngre (2 klasser) och tvingar tillbaka
     oktagonformen när ramen faktiskt sitter på bälte-badgen. */
  .avatar-frame-jaktchase.frame-shape-octagon,
  .avatar-frame-eldfrostcombo.frame-shape-octagon,
  .avatar-frame-fullshift.frame-shape-octagon,
  .avatar-frame-cycleall.frame-shape-octagon {
    clip-path: polygon(47% 0%, 53% 0%, 92% 25%, 92% 75%, 53% 100%, 47% 100%, 8% 75%, 8% 25%);
  }
  /* Sonar-puls: en alltid synlig fylld ring (samma princip som pulserande
     röd) med en extra expanderande "eko"-ring ovanpå, så den är minst lika
     tydlig i vila och sen sticker ut med rörelsen. */
  @keyframes avatarFrameHueCycle {
    from { filter: hue-rotate(0deg); }
    to { filter: hue-rotate(360deg); }
  }
  @keyframes avatarFrameSonarPulseBig {
    0% { transform: scale(0.55); opacity: 1; }
    100% { transform: scale(1.45); opacity: 0; }
  }
  .avatar-frame-sonar-rainbow { position: relative; border-radius: 50%; clip-path: circle(50%); }
  .avatar-frame-sonar-rainbow::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, #34D97B, #2DE0FF, #9B6BFF, #FF3DB0, #34D97B);
    opacity: 0.6;
    animation: avatarFrameSpin 6s linear infinite;
  }
  .avatar-frame-sonar-rainbow::after {
    content: ""; position: absolute; inset: 4%; border-radius: 50%;
    border: 4px solid #FF3DB0;
    animation: avatarFrameSonarPulseBig 1.8s ease-out infinite, avatarFrameHueCycle 2.5s linear infinite;
  }
  /* Glitter-ring: täta streck som roterar stadigt i konstant färg. */
  .avatar-frame-glitter { position: relative; overflow: hidden; border-radius: 50%; clip-path: circle(50%); }
  .avatar-frame-glitter::before {
    content: ""; position: absolute; inset: -10%;
    background: repeating-conic-gradient(var(--glitter-c, #FF2EC4) 0deg 4deg, transparent 4deg 20deg);
    animation: avatarFrameSpin 6s linear infinite;
  }
  /* Jagande prickar: tre punkter i omlopp. */
  .avatar-frame-chase-rainbow { position: relative; overflow: hidden; border-radius: 50%; clip-path: circle(50%); }
  .avatar-frame-chase-rainbow::before {
    content: ""; position: absolute; inset: -10%;
    background: conic-gradient(from 0deg,
      #FF3DB0 0deg 10deg, transparent 10deg 120deg,
      #2DE0FF 120deg 130deg, transparent 130deg 240deg,
      #FFD24C 240deg 250deg, transparent 250deg 360deg);
    animation: avatarFrameSpin 1.6s linear infinite;
  }
  /* Samma teknik som Jagande prickar men med 5 punkter istället för 3. */
  .avatar-frame-chase-rainbow5 { position: relative; overflow: hidden; border-radius: 50%; clip-path: circle(50%); }
  .avatar-frame-chase-rainbow5::before {
    content: ""; position: absolute; inset: -10%;
    background: conic-gradient(from 0deg,
      #FF3DB0 0deg 8deg, transparent 8deg 72deg,
      #FFD24C 72deg 80deg, transparent 80deg 144deg,
      #34D97B 144deg 152deg, transparent 152deg 216deg,
      #2DE0FF 216deg 224deg, transparent 224deg 288deg,
      #9B6BFF 288deg 296deg, transparent 296deg 360deg);
    animation: avatarFrameSpin 1.8s linear infinite;
  }
  /* Norrsken borttagen (för lik RGB-ringen). */
  /* Ram/glow: "jakt" - två svansar i SAMMA riktning men olika tempo, så den
     snabbare hinner ikapp den långsammare, går ihop och drar om - som
     Firefox gamla sidladdnings-snurra. Färgen sätts via --jakt-c1/--jakt-c2
     inline per val, så samma klass funkar för alla jakt-ramar. */
  .avatar-frame-jaktchase { position: relative; overflow: hidden; border-radius: 50%; clip-path: circle(50%); }
  .avatar-frame-jaktchase::before {
    content: ""; position: absolute; inset: -30%; border-radius: 50%;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 250deg,
      var(--jakt-c2, rgba(255,210,76,0.5)) 285deg,
      var(--jakt-c1, rgba(255,210,76,0.9)) 325deg,
      #FFFFFF 345deg,
      transparent 360deg);
    animation: avatarFrameSpin 2.6s linear infinite;
  }
  .avatar-frame-jaktchase::after {
    content: ""; position: absolute; inset: -30%; border-radius: 50%;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 250deg,
      var(--jakt-c2, rgba(255,210,76,0.5)) 285deg,
      var(--jakt-c1, rgba(255,210,76,0.9)) 325deg,
      #FFFFFF 345deg,
      transparent 360deg);
    animation: avatarFrameSpin 1.3s linear infinite;
    mix-blend-mode: screen;
  }
  .avatar-frame-jaktchase > img, .avatar-frame-jaktchase > div { position: relative; z-index: 1; }
  /* Ram/glow: en helt fylld ring (ingen genomskinlig del) som roterar
     långsamt så färgen glider mjukt silver -> guld -> diamant -> om igen,
     utan hårda övergångar. */
  .avatar-frame-fullshift { position: relative; overflow: hidden; border-radius: 50%; clip-path: circle(50%); }
  .avatar-frame-fullshift::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, #C4C2B8 0deg, #EF9F27 120deg, #8FD6FF 240deg, #C4C2B8 360deg);
    animation: avatarFrameSpin 9s linear infinite;
  }
  .avatar-frame-fullshift > img, .avatar-frame-fullshift > div { position: relative; z-index: 1; }
  /* Ram/glow: eld (långsam) + frost (snabb) i samma ring - samma "jakt"-
     princip men med två olika teman istället för en färg i två tempon. */
  .avatar-frame-eldfrostcombo { position: relative; overflow: hidden; border-radius: 50%; clip-path: circle(50%); }
  .avatar-frame-eldfrostcombo::before {
    content: ""; position: absolute; inset: -30%; border-radius: 50%;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 250deg,
      rgba(239,159,39,0.5) 285deg,
      rgba(226,75,74,0.9) 325deg,
      #FFFFFF 345deg,
      transparent 360deg);
    animation: avatarFrameSpin 3.2s linear infinite;
  }
  .avatar-frame-eldfrostcombo::after {
    content: ""; position: absolute; inset: -30%; border-radius: 50%;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 250deg,
      rgba(200,240,255,0.5) 285deg,
      rgba(45,224,255,0.9) 325deg,
      #FFFFFF 345deg,
      transparent 360deg);
    animation: avatarFrameSpin 1.1s linear infinite;
    mix-blend-mode: screen;
  }
  .avatar-frame-eldfrostcombo > img, .avatar-frame-eldfrostcombo > div { position: relative; z-index: 1; }
  /* Ram/glow: "alla mina ramar" - vilken enskild ram som visas just nu styrs
     av JS (se initCycleAllFrames i app.js), som växlar CSS-klass på elementet
     med jämna mellanrum. Denna klass är bara en neutral startpunkt innan JS
     hunnit sätta igång växlingen. */
  .avatar-frame-cycleall { position: relative; overflow: hidden; border-radius: 50%; clip-path: circle(50%); }
  .avatar-frame-cycleall::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, #FFD24C, #34D97B, #9B6BFF, #FF3DB0, #2DE0FF, #FFD24C);
    animation: avatarFrameSpin 4s linear infinite;
  }
  .avatar-frame-cycleall > img, .avatar-frame-cycleall > div { position: relative; z-index: 1; }
  .avatar-frame-sonar-rainbow > img, .avatar-frame-sonar-rainbow > div,
  .avatar-frame-glitter > img, .avatar-frame-glitter > div,
  .avatar-frame-chase-rainbow > img, .avatar-frame-chase-rainbow > div,
  .avatar-frame-chase-rainbow5 > img, .avatar-frame-chase-rainbow5 > div {
    position: relative; z-index: 1;
  }
  .celebration-overlay {
    position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    animation: celebFadeIn .2s ease;
  }
  @keyframes celebFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes celebPop {
    0% { transform: scale(0.7); opacity: 0; }
    60% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .celebration-card {
    position: relative;
    background: var(--card-bg); border: 1px solid var(--border2); border-radius: 20px;
    padding: 28px 24px; max-width: 300px; width: 100%; text-align: center;
    animation: celebPop .35s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  /* Samma "poppa ut"-effekt som platina-kortet, fast mindre - för vanliga
     prestations-upplåsningar med en riktig badge-bild. */
  .achievement-badge-pop {
    position: absolute; top: -44px; left: 50%; transform: translateX(-50%);
    width: 112px; max-height: 130px; height: auto; z-index: 2;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.45));
    animation: platinumBadgePop .5s cubic-bezier(.34,1.56,.64,1) .05s both;
  }
  .celebration-icon {
    width: 68px; height: 68px; border-radius: 50%; border: 2px solid; margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .celebration-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .celebration-sub { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
  .celebration-achievement { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
  .celebration-xp { font-size: 15px; font-weight: 800; margin-bottom: 16px; }
  /* Platina-firandet: större, guldigare, med fallande konfetti - ska kännas
     som en riktig milstolpe jämfört med en vanlig prestations-popup. */
  .celebration-card-platinum {
    position: relative; overflow: visible; max-width: 400px;
    padding: 112px 30px 34px;
    border-color: rgba(239,159,39,0.5);
    border-width: 2px;
    box-shadow: 0 20px 70px rgba(239,159,39,0.3);
  }
  .celebration-card-platinum .celebration-title { font-size: 26px; margin-bottom: 8px; }
  .platinum-icon-ring { animation: avatarFramePulse 1.3s ease-in-out infinite; }
  .platinum-badge-img {
    position: absolute; top: -64px; left: 50%; transform: translateX(-50%);
    width: 190px; height: auto; z-index: 2;
    filter: drop-shadow(0 10px 26px rgba(0,0,0,0.5));
    animation: platinumBadgePop .55s cubic-bezier(.34,1.56,.64,1) .1s both;
  }
  @keyframes platinumBadgePop {
    0% { transform: translateX(-50%) scale(0.4); opacity: 0; }
    65% { transform: translateX(-50%) scale(1.12); opacity: 1; }
    100% { transform: translateX(-50%) scale(1); opacity: 1; }
  }
  .platinum-confetti { position: absolute; inset: -60px 0 0 0; pointer-events: none; overflow: hidden; border-radius: inherit; }
  .platinum-confetti span {
    position: absolute; top: -10%; left: calc(var(--i) * 4.3%);
    width: 6px; height: 10px;
    background: hsl(calc(var(--i) * 35deg) 80% 55%);
    animation: platinumConfettiFall 2.6s linear infinite;
    animation-delay: calc(var(--i) * -0.11s);
  }
  @keyframes platinumConfettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(340px) rotate(540deg); opacity: 0; }
  }
  .modal-sheet { overflow-x: hidden; }
  .undo-toast {
    position: fixed; bottom: calc(84px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    background: var(--card-bg); border: 1px solid var(--border2); border-radius: 12px;
    padding: 10px 16px; display: flex; align-items: center; gap: 14px; z-index: 60;
    box-shadow: 0 4px 20px rgba(0,0,0,0.35); font-size: 13px;
  }
  .undo-toast button {
    background: none; border: none; color: #2DD4BF; font-weight: 700; font-size: 13px;
    cursor: pointer; font-family: inherit; padding: 2px 4px;
  }
  .xp-bump-toast {
    position: fixed; top: calc(70px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    background: var(--card-bg); border: 1px solid var(--border2); border-radius: 999px;
    padding: 6px 16px; font-size: 13px; font-weight: 800; z-index: 60;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3); pointer-events: none;
    animation: xpBumpFade 1.7s ease forwards;
  }
  @keyframes xpBumpFade {
    0% { opacity: 0; transform: translateX(-50%) translateY(-6px); }
    15% { opacity: 1; transform: translateX(-50%) translateY(0); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(-6px); }
  }
  /* Bälte-stripes vid höga kampsportsnivåer: scrollbar döljs visuellt så det
     inte ser ut som ett UI-element som stack ut, men förblir scrollbart. */
  .belt-stripe-scroll {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .belt-stripe-scroll::-webkit-scrollbar { display: none; }
  /* Tränings-heatmapen i årskrönikan kan bli bredare än skärmen (en kolumn
     per vecka på året) - samma osynliga-scrollbar-teknik som bälte-stripes. */
  .heatmap-scroll {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .heatmap-scroll::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="title-group">
      <img id="appHeaderIcon" class="app-header-icon" alt="" />
      <span class="title">Workout Tracker</span>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Inställningar"></button>
  </header>
  <div class="backup-banner" id="backupBanner">
    <p id="backupBannerText"></p>
    <div class="backup-banner-actions">
      <button class="now-btn" id="backupBannerNow">Säkerhetskopiera nu</button>
      <button class="later-btn" id="backupBannerSnooze">Påminn om 3 dagar</button>
    </div>
  </div>
  <main id="content"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="modalRoot"></div>
<input type="file" id="importFileInput" accept="application/json" style="display:none" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
